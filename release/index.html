<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>svgMotion</title>
    <meta charset="utf-8">
    <meta name="description" content="A vector animation tool.">
    <meta name="author" content="Michael Schwartz">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content">
    <meta property="og:url"         content="https://michaelsboost.github.io/svgMotion/" />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="svgMotion" />
    <meta property="og:description" content="A vector animation tool." />
    <meta property="og:image"       content="https://raw.githubusercontent.com/michaelsboost/svgMotion/gh-pages/imgs/header.png" />
    <link rel="shortcut icon" href="imgs/logo.svg" type="image/x-icon">
    <!-- Chrome, Firefox OS and Opera -->
    <meta name="theme-color" content="#ffffff">
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#ffffff">
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="svgMotion">
    <link rel="apple-touch-icon" href="imgs/logo.png">
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="svgMotion" />
    <meta property="og:description" content="A vector animation tool." />
    <link rel="stylesheet" href="css/imports.css">
    <link rel="apple-touch-icon" href="imgs/logo.svg">
    <link rel="icon" type="image/png" href="imgs/logo.svg" />
  </head>
  <body>
    <div class="absolute inset-0">
      <!-- canvas container -->
      <div id="canvasContainer" class="absolute inset-0 overflow-hidden bg-gray-800 md:left-80 flex flex-col">
        <div id="svgCanvas" data-topNavContent="svg" class="flex-grow relative">
          <div id="previewSVG" class="w-full h-full">
            <!-- svg is rendered here -->
          </div>
          <div id="fill" class="absolute inset-0"></div>
        </div>
      
        <!-- Bottom canvas navigation -->
        <div 
          id="bottomNav"
          class="absolute bottom-0 inset-x-0 py-2 pl-2 pr-4 bg-gray-900 text-white">
          <div 
            class="flex justify-between">
            <div>
              <button 
                name="Toggle Layers Panel"
                data-toggletab="layers"
                class="text-xs p-2 capitalize">
                
                <i class="pr-2 fa fa-sitemap"></i>
                <span>layers</span>
              </button>
              <button 
                name="Toggle Animation Panel"
                data-toggletab="timeline"
                class="text-xs p-2 capitalize">
                
                <i class="pr-2 fa fa-diamond"></i>
                <span>timeline</span>
              </button>
            </div>
            <div>
              <button 
                data-zoom="true"
                name="Toggle zooming and panning"
                class="text-xs py-2 pr-2">
                <i class="fa fa-light fa-magnifying-glass-plus"></i>
              </button>
            </div>
          </div>
          
          <div id="tabsNav" class="overflow-auto flex flex-col">
            <div data-tabcontent="layers" class="hidden relative flex flex-col h-[40vh]">
              <div class="flex-grow overflow-auto">
                <div id="layers"></div>
              </div>
              <div data-editorLayersNavbar class="flex-none px-4 text-center overflow-auto"></div>
            </div>
            <div data-tabcontent="timeline" class="hidden relative flex flex-col h-[40vh]">
              <div class="flex-grow overflow-auto">
                <div id="timeline"></div>
              </div>
              <div data-editorTimelineNavbar class="flex-none px-4 text-center overflow-auto"></div>
            </div>
          </div>
        </div>
        
        <!-- top run preview navigation bar for file name, type as well as changing view sizes -->
        <div 
          class="absolute top-14 inset-x-0 bg-black text-white">
          <div>
            <div class="relative top-[5px] mb-[5px] h-[8px] mx-[15px] overflow-visible">
              <div id="timelinetrack" class="bg-[#999999] opacity-[.6]"></div>
              <div id="progressbar" class="bg-[#3d99ff] h-[8px] top-0 pointer-events-none" style="width: 50%;"></div>
              <div id="seekbar" class="w-full absolute h-[24px] top-[-12px] left-0 bg-transparent"></div>
              <div id="playhead" class="absolute top-[-5px] -translate-x-2/4 translate-y-0 w-4 h-4 border bg-[#3d99ff] touch-manipulation cursor-ew-resize select-none rounded-[50%] border-solid border-[#3d99ff] left-[0%]" style="touch-action: pan-y; cursor: grab; user-select: none; transform: translate(-50%, 0%) translate3d(0px, 0px, 0px);"></div>
            </div>
          </div>
          <div 
            class="flex justify-between items-center px-2">
            <div>
              <select class="bg-transparent capitalize">
                <option value="misc" selected>misc</option>
              </select>
              
              <button>
                <svg style="isolation:isolate" viewBox="0 0 512 512">
                  <path d=" M 192.743 0 C 182.817 0.012 174.773 8.056 174.761 17.982 L 174.761 79.236 C 116.852 85.799 76.903 99.115 76.903 114.519 L 76.903 143.814 C 76.903 149.801 83.295 155.298 94.204 160.454 C 122.753 173.855 184.519 183.102 256 183.102 C 327.588 183.102 389.161 173.855 417.796 160.454 C 428.62 155.298 435.097 149.801 435.097 143.814 L 435.097 114.519 C 435.097 98.625 391.91 84.797 330.57 78.555 L 330.57 17.961 C 330.547 8.043 322.506 0.012 312.588 0 L 192.743 0 Z  M 210.725 32.619 L 295.288 32.619 C 297.12 32.619 297.951 41.184 297.951 51.922 L 297.951 75.891 C 283.98 75.108 269.992 74.675 256 74.592 C 240.873 74.592 226.044 75.167 212.046 75.913 L 207.401 76.573 L 207.401 51.944 C 207.401 41.205 208.978 32.641 210.725 32.641 L 210.725 32.619 Z  M 102.193 203.726 C 100.502 205.337 99.343 207.426 98.87 209.713 L 98.87 211.055 C 98.87 211.396 98.784 212.121 98.87 212.398 L 110.865 462.741 C 111.909 482.342 134.642 512 256 512 C 377.358 512 400.07 482.385 401.157 462.72 L 413.13 212.376 L 413.13 209.713 C 412.688 207.421 411.523 205.33 409.807 203.747 C 394.147 219.62 331.146 221.708 256 221.708 C 180.854 221.708 117.938 219.62 102.193 203.726 Z "></path>
                </svg>
              </button>
              
              <button>
                <i class="fa fa-trash"></i>
              </button>
              
              <button class="ml-2">
                Edit
              </button>
            </div>

            <div>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-backward-fast"></i>
              </button>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-backward-step"></i>
              </button>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-play"></i>
              </button>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-forward-step"></i>
              </button>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-forward-fast"></i>
              </button>
              <button
                class="m-0 p-2 border-0 bg-transparent text-current text-sm">
                <i class="fa fa-repeat"></i>
              </button>
              <select class="bg-transparent ml-2">
                <option value="10">10x</option>
                <option value="5">5x</option>
                <option value="2">2x</option>
                <option value="1" selected>1x</option>
                <option value="0.5">0.5x</option>
                <option value="0.25">0.25x</option>
                <option value="0.1">0.1x</option>
              </select>
            </div>

            <div>
              <span>0.00</span> / <span>1.00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- top navbar -->
      <nav class="absolute top-0 inset-x-0 flex align-center place-items-center justify-between p-2 text-white bg-gray-900">
        <ul id="topnav" class="p-0 m-0">
          <button 
            name="toggle menu"
            class="m-0 border-0 mx-2 px-2 py-2 bg-transparent inline-block md:hidden">
            <label for="menu" class="cursor-pointer">
              <input type="checkbox" id="menu" class="hidden">
              <i class="fa fa-bars cursor-pointer"></i>
            </label>
          </button>
          <a href="https://twitter.com/michaelsboost" target="_blank"
            class="mx-2 px-2 py-2">
            <i class="fa fa-brands fa-x-twitter"></i>
          </a>
          <a href="https://michaelsboost.com/donate/" target="_blank"
            class="mx-2 px-2 py-2">
            <i class="fa fa-heart text-red-400"></i>
          </a>
        </ul>
        <ul class="p-0">
          <button 
            id="share"
            name="share to codepen"
            class="capitalize border-0 px-4 py-2 rounded-md bg-blue-500 text-white">
              <span>
                share &nbsp; <i class="fa fa-brands fa-codepen"></i>
              </span>
          </button>
        </ul>
      </nav>
      
      <!-- Side navigation --> 
      <nav id="sidenav" class="absolute left-0 top-14 bottom-0 bg-gray-900 text-white w-full md:block md:w-80 p-4 z-10 overflow-y-auto hidden">
        <ul class="px-2">
          <li>
            <div class="text-center">
              <a id="appUrl" target="_blank">
                <img id="appLogo" class="my-4 w-24 m-auto" src="imgs/logo.svg">
              </a>
              <div class="text-2xl">
                About <span id="appName"></span>
              </div>
              <div class="my-2 text-xs">
                Version <span id="appVersion"></span>
              </div>
              <div>
                <a id="appLicense" target="_blank" class="text-sm underline mb-2 text-blue-500">
                  Open Source License
                </a>
              </div>
            </div>
          </li>
          <li class="py-4 px-2">
            <hr>
          </li>
          <li>
            <button 
              id="newProj"
              name="initialize new project"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-file"></i> 
              <span>
                new project
              </span>
            </button>
          </li>
          <li>
            <label for="import"
              class="cursor-pointer capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-file-import"></i> 
              <span>
                import file
              </span>
            </label>
          </li>
          <li>
            <button 
              id="exportProj"
              name="export project file"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-file-export"></i> 
              <span>
                export project
              </span>
            </button>
          </li>
          <li>
            <button 
              id="exportSequence"
              name="export as sequence"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-images"></i> 
              <span>
                export as sequence
              </span>
            </button>
          </li>
          <li>
            <button 
              id="exportGif"
              name="export gif file"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-image"></i> 
              <span>
                export as gif
              </span>
            </button>
          </li>
          <li>
            <button 
              id="exportMp4"
              name="export mp4 file"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-film"></i> 
              <span>
                export as mp4
              </span>
            </button>
          </li>
          <li>
            <button 
              id="exportZip"
              name="export html zip file"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-brands fa-html5"></i> 
              <span>
                export as html
              </span>
            </button>
          </li>
          <li class="py-4 px-2">
            <hr>
          </li>
          <li>
            <a 
              href="https://greensock.com/docs/v3"
              target="_blank"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-graduation-cap"></i> 
              <span>
                Official GSAP Documentation
              </span>
            </a>
          </li>
          <li>
            <a 
              href="https://greensock.com/docs/v3/Eases"
              target="_blank"
              class="capitalize py-2 block w-full text-left items-center rounded-md">
              <i class="w-10 px-2 fa fa-graduation-cap"></i> 
              <span>
                Official Ease Documentation
              </span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  
    <script src="js/import.js"></script>
  </body>
</html>
